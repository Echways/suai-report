name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Тег совпадает с версией
        if: github.ref_type == 'tag'
        run: python3 scripts/ctan.py check-tag "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@v4
        with:
          name: pdf

      - name: Архив
        run: python3 scripts/ctan.py package

      - uses: actions/upload-artifact@v4
        with:
          name: ctan
          path: dist/suai-report.zip
          if-no-files-found: error

  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ctan
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pdf
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ctan.py notes > notes.md
          cp demo/build/main.pdf dist/suai-report-demo.pdf
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/suai-report.zip dist/suai-report-demo.pdf --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/suai-report.zip dist/suai-report-demo.pdf \
              --title "suai-report $GITHUB_REF_NAME" --notes-file notes.md
          fi
