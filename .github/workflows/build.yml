name: build

on:
  push:
  pull_request:

jobs:
  # Логика команды guap, TeX не нужен
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # Сборка тем же guap build, что и локально: аргументы latexmk
  # из src/vscode/settings.json, guap.sty находится через TEXINPUTS
  pdf:
    needs: test
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)

      - name: Демо-отчёт
        run: python3 scripts/guap.py build demo

      - name: Заготовка, созданная генератором
        run: |
          python3 scripts/guap.py new ci/lab-1 --no-open --title "Проверка"
          python3 scripts/guap.py build ci/lab-1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf
          if-no-files-found: ignore
          path: |
            demo/main.pdf
            ci/lab-1/main.pdf
            demo/build/main.log
            ci/lab-1/build/main.log
