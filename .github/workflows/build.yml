name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  pdf:
    needs: test
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      - name: Python
        run: command -v python3 || (apt-get update && apt-get install -y --no-install-recommends python3)

      - name: Тесты пакета
        run: python3 -m unittest discover -s tests -p test_sty.py -v

      - name: Демо-отчёт
        run: python3 scripts/suai.py build docs/demo

      - name: Заготовка, созданная генератором
        run: |
          python3 scripts/suai.py new ci/lab-1 --no-open --title "Проверка"
          python3 scripts/suai.py build ci/lab-1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf
          if-no-files-found: ignore
          path: |
            docs/demo/build/main.pdf
            ci/lab-1/build/main.pdf
            docs/demo/build/main.log
            ci/lab-1/build/main.log
