name: build

on:
  push:
  pull_request:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # В CI нет ~/texmf: кладём guap.sty рядом с main.tex
      - run: |
          python3 scripts/guap.py new ci/lab-1 --no-open --title "Проверка"
          cp src/guap.sty demo/ && cp src/guap.sty ci/lab-1/

      # Демо-отчёт
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: demo
          latexmk_use_xelatex: true

      # Заготовка, созданная генератором, тоже должна собираться
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ci/lab-1
          latexmk_use_xelatex: true

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            demo/main.pdf
            ci/lab-1/main.pdf
